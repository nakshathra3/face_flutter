name: working_emu
description: Face and Emotion Based Attendance App

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0
  http: ^1.2.0
  permission_handler: ^11.3.0
  intl: ^0.19.0
  google_fonts: ^6.1.0

  google_mlkit_face_detection: ^0.11.0


flutter:
  uses-material-design: true
  assets:
    - assets/data/
    - assets/images/

dev_dependencies:
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon_foreground.png"  # Your single source icon (1024x1024 recommended)